<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; font-family: Arial, 'Malgun Gothic', sans-serif; color: #162334; }
    .wrap { max-width: 470px; margin: 9vh auto; padding: 18px; }
    .card { background: white; border-radius: 20px; padding: 32px 24px; box-shadow: 0 10px 35px rgba(0,0,0,.08); text-align: center; }
    .brand { color: #b91c1c; font-size: 16px; font-weight: 800; }
    .emoji { font-size: 58px; margin: 22px 0 8px; }
    h1 { font-size: 24px; line-height: 1.4; margin: 10px 0; }
    p { color: #657184; line-height: 1.6; font-size: 15px; }
    button { width: 100%; margin: 22px 0 8px; border: 0; background: #c92d2b; color: white; font-size: 19px; font-weight: 700; border-radius: 12px; padding: 19px 12px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: progress; }
    .small { font-size: 12px; color: #7b8391; }
  </style>
</head>
<body>
  <div class="wrap"><main class="card">
    <div class="brand">영월소방서 · 소방안전교육</div>
    <div class="emoji" aria-hidden="true">🧯</div>
    <h1>소화기 사용법을<br>영상으로 배워보세요!</h1>
    <p>화재가 나기 전에 올바른 소화기 사용법을 미리 익혀주세요.</p>
    <a href="https://youtu.be/8_7hDPeUUro?si=pMyuege_RdLaUa3z" target="_blank" rel="noopener noreferrer" id="watch" onclick="recordVideoClick()" style="display:block;width:100%;margin:22px 0 8px;background:#c92d2b;color:white;font-size:19px;font-weight:700;border-radius:12px;padding:19px 12px;text-decoration:none">▶ 소화기 사용법 영상 보기</a>
    <p id="msg" class="small" aria-live="polite">버튼을 누르면 유튜브 영상으로 이동합니다.</p>
  </main></div>
  <script>
    function recordVideoClick() {
      // 유튜브는 즉시 새 탭으로 열리고, 기존 페이지에서 클릭 기록을 전송합니다.
      google.script.run.withFailureHandler(function() {
        document.getElementById('msg').textContent = '클릭 기록 저장에 실패했습니다.';
      }).recordClick();
    }
  </script>
</body>
</html>
